<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172b46"><title>Tire Locator</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172b46;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:550px;margin:auto;padding:24px 18px 65px}h1{margin:8px 0 4px;font-size:29px}p{color:#64748b;margin:5px 0 22px}.panel{background:white;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 2px 16px #172b4610}label{display:block;font-size:13px;font-weight:700;margin:12px 0 7px}input,select{width:100%;padding:15px;border:1px solid #cbd5e1;border-radius:12px;font-size:18px;background:white;color:#172b46}button{border:0;background:#2156b6;color:white;border-radius:12px;padding:14px 17px;font-size:15px;font-weight:700;cursor:pointer}button.secondary{background:#e9effa;color:#21416f}button.danger{background:#fbe9e9;color:#ad2929}.tabs{display:flex;gap:7px}.tabs button{flex:1;padding:12px 6px}.tabs button:not(.active){background:#e2e8f0;color:#475569}.result{padding:23px;background:#e9f5ed;border-radius:14px;text-align:center;margin-top:15px}.result strong{display:block;font-size:27px;margin:7px}.muted{color:#64748b;font-size:13px}.error{color:#b42318}.item{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e2e8f0;padding:12px 0;gap:10px}.item:last-child{border:0}.hidden{display:none}.row{display:flex;gap:9px}.row>*{flex:1;min-width:0}.small{font-size:12px}footer{color:#64748b;font-size:12px;margin-top:22px;line-height:1.5}</style></head><body><main class="wrap"><h1>🛞 Tire Locator</h1><p>Find customer tires in seconds.</p><div class="tabs"><button class="active" data-tab="search">Search</button><button data-tab="add">Add / Edit</button><button data-tab="inventory">Inventory</button></div>
<div id="storageWarning" class="muted" style="margin-top:12px"></div><section id="search" class="panel"><label for="query">4-digit tire number</label><input id="query" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="e.g. 2358" autocomplete="off"><div id="result" aria-live="polite"></div></section>
<section id="add" class="panel hidden"><form id="form"><label for="id">4-digit tire number</label><input id="id" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="e.g. 2358"><div class="row"><div><label for="container">Container</label><select id="container"><option value="1">Container 1</option><option value="2">Container 2</option><option value="3">Container 3</option></select></div><div><label for="side">Side</label><select id="side"><option value="Left">Left</option><option value="Right">Right</option></select></div></div><label for="notes">Notes (optional)</label><input id="notes" maxlength="150" placeholder="Extra details"><button type="submit" style="width:100%;margin-top:18px">Save Tire</button><div id="saveMessage" class="muted" aria-live="polite" style="margin-top:12px"></div></form></section>
<section id="inventory" class="panel hidden"><div class="row"><button class="secondary" id="export">Export Backup</button><button class="secondary" id="importButton">Import Backup</button><input type="file" id="import" accept=".json,application/json" class="hidden"></div><label for="filter">Filter tires</label><input id="filter" inputmode="numeric" placeholder="Search number"><div id="count" class="muted" style="margin-top:12px"></div><div id="items"></div></section><footer>Records are stored in this browser on this device. Clearing browser data or opening this file in a different browser may lose access to saved records. Export backups regularly. This version does not sync across devices.</footer></main>
<script>
const KEY='tire-locator-v1';let records={};let storageAvailable=true;try{localStorage.setItem('__tire_test','1');localStorage.removeItem('__tire_test')}catch(e){storageAvailable=false}try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))records=x}catch(e){alert('Saved data could not be loaded. Please restore a backup.')}
const $=id=>document.getElementById(id);const valid=id=>/^\d{4}$/.test(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){if(!storageAvailable){$('storageWarning').textContent='⚠️ This viewer blocks permanent storage. Your changes work for this session only. Export a backup before closing.';return true}try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch(e){storageAvailable=false;$('storageWarning').textContent='⚠️ Permanent storage is blocked. Export a backup before closing.';return true}}
function show(tab){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['search','add','inventory'].forEach(t=>$(t).classList.toggle('hidden',t!==tab));if(tab==='inventory')renderList()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function renderSearch(){const q=$('query').value.trim();if(!q){$('result').innerHTML='<p class="muted">Enter a tire number to find its location.</p>';return}if(!valid(q)){$('result').innerHTML='<p class="muted">Enter exactly 4 digits.</p>';return}const r=records[q];$('result').innerHTML=r?`<div class="result"><span>FOUND · #${esc(q)}</span><strong>Container ${esc(r.container)}</strong><strong>${esc(r.side)} Side</strong>${r.notes?`<div>${esc(r.notes)}</div>`:''}</div>`:'<p class="error">No tire found with this number.</p>'}
$('query').oninput=renderSearch;
$('form').onsubmit=e=>{e.preventDefault();const id=$('id').value.trim();if(!valid(id))return alert('Enter exactly four digits.');if(records[id]&&!confirm('This number already exists. Update its location?'))return;const old=records[id];records[id]={container:$('container').value,side:$('side').value,notes:$('notes').value.trim()};if(!save()){if(old)records[id]=old;else delete records[id];return}$('saveMessage').textContent=`Added #${id}. ${storageAvailable?'Saved on this device.':'Export a backup before closing.'}`;$('form').reset();renderSearch();renderList()};
function renderList(){const q=$('filter').value.trim();const ids=Object.keys(records).sort().filter(id=>id.includes(q));$('count').textContent=`${Object.keys(records).length} total tires · ${ids.length} shown`;$('items').innerHTML=ids.length?ids.map(id=>{const r=records[id];return `<div class="item"><div><b>#${esc(id)}</b><div class="muted">Container ${esc(r.container)} · ${esc(r.side)}${r.notes?' · '+esc(r.notes):''}</div></div><div><button class="secondary small" data-edit="${id}">Edit</button> <button class="danger small" data-delete="${id}">Delete</button></div></div>`}).join(''):'<p class="muted">No matching records.</p>'}
$('filter').oninput=renderList;$('items').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.edit||b.dataset.delete;if(!id||!records[id])return;if(b.dataset.delete){if(confirm(`Delete tire #${id}?`)){const old=records[id];delete records[id];if(!save())records[id]=old;renderList();renderSearch()}}else{$('id').value=id;$('container').value=records[id].container;$('side').value=records[id].side;$('notes').value=records[id].notes||'';$('saveMessage').textContent='Editing existing record';show('add')}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='tire-locator-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importButton').onclick=()=>$('import').click();$('import').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.version!==1||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error('Invalid backup');const next={};for(const [id,r] of Object.entries(obj.records)){if(!valid(id)||!['1','2','3'].includes(String(r.container))||!['Left','Right'].includes(r.side)||typeof (r.notes||'')!=='string')throw Error('Invalid record');next[id]={container:String(r.container),side:r.side,notes:(r.notes||'').slice(0,150)}}if(!confirm(`Replace current inventory with ${Object.keys(next).length} imported records? Export a backup first if needed.`))return;const old=records;records=next;if(!save()){records=old;return}renderList();renderSearch();alert('Backup imported successfully.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}};if(!storageAvailable)$('storageWarning').textContent='⚠️ This viewer blocks permanent storage. Export a backup before closing.';renderSearch();
</script></body></html>
